paths:
  /users:
    get:
      description: Получить пользователей с лимит и оффсет
      parameters:
      - description: size of the page with users
        in: query
        name: limit
        type: integer
      - description: size of the page with users
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: List of users
          schema:
            items:
