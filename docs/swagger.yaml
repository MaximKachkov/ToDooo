      summary: Получить пользователя
      tags:
      - users
    patch:
      consumes:
      - application/json
      description: "Patch and existing user by id\n### Логика обновления полей (Three-state
        logic):\n1. ***Поле не передано***: `phone_number` игнорируется , значение
        в БД не меняется\n2. ***Явно передано значение***: `\"phone_number\":\"+77081540727\"`
        - устанавливает новый номер в бд\n3. **Передан null**: `\"phone_number\":
        null`\t null - очищает значение в дб\n4. Ограничения: `full_name` не может
        быть выставлен как null"
      parameters:
      - description: id of user
        in: path
        name: id
        required: true
        type: integer
      - description: request body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_features_users_transport_http.PatchUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Patched user
          schema:
            $ref: '#/definitions/internal_features_users_transport_http.PatchUserResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_MaximKachkov_ToDooo_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_MaximKachkov_ToDooo_internal_core_transport_http_response.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_MaximKachkov_ToDooo_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_MaximKachkov_ToDooo_internal_core_transport_http_response.ErrorResponse'
      summary: Patch  user
      tags:
      - users
